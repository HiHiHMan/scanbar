<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanbar | Label Studio</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
  <header class="topbar">
    <div>
      <div class="brand">Scanbar <span class="status">LABEL STUDIO</span></div>
      <div class="subtitle">Inventory · Tbl_Label_Prints · Label preview & print</div>
    </div>
    <div id="connection" class="status">กำลังตรวจสอบการเชื่อมต่อ…</div>
  </header>
  <main class="wrap">
    <section class="intro">
      <div>
        <h1>Label Print Studio</h1>
        <div class="muted">เลือกข้อมูล แล้วพิมพ์เป็นฉลาก 4 บรรทัดสำหรับเครื่องพิมพ์ Label</div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="ค้นหา Location, Product ID, Barcode…" aria-label="ค้นหาข้อมูล">
        <button class="secondary" id="refresh" type="button">↻ รีเฟรช</button>
        <button class="secondary" id="selectAll" type="button">เลือกทั้งหมด</button>
        <button id="printSelected" type="button">พิมพ์ที่เลือก</button>
      </div>
    </section>
    <section class="stats">
      <div class="stat"><strong id="totalCount">—</strong><span>ข้อมูลทั้งหมด</span></div>
      <div class="stat"><strong id="visibleCount">—</strong><span>รายการที่แสดง</span></div>
      <div class="stat"><strong id="selectedCount">0</strong><span>รายการที่เลือกพิมพ์</span></div>
    </section>
    <section id="labels" class="grid">
      <div class="empty">กำลังโหลดข้อมูล…</div>
    </section>
    <div class="foot"><span id="count">0 รายการ</span><span id="updated">ยังไม่ได้อัปเดต</span></div>
  </main>
    <script src="js/app.js" defer></script>
</body>

</html>
